name: libraries (libraries.php)

on:
  schedule:
    # 1時間ごと / 毎時0分の混雑を避けて:11に実行 (00:11,01:11,...UTC)
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 多重実行防止: 実行中なら次回はキュー待ち（同時実行しない）
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json, mbstring

      - name: Update libraries
        run: php libraries.php

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            libs=$(jq 'length' docs/libraries.json)
            git commit -m "auto update (libraries: ${libs})"
            git push
          fi

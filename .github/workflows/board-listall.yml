name: board listall (run.php)

on:
  schedule:
    # 1日2回 / UTC 09:43,21:43 = JST 18:43,06:43 (毎時0分の混雑を避けてずらす)
    - cron: "43 9,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 多重実行防止: 実行中なら次回はキュー待ち（同時実行しない）
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json, mbstring

      - name: Run (arduino-cli setup + run.php)
        run: bash run.sh

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            boards=$(jq 'length' docs/board_details.json)
            git commit -m "auto update (boards: ${boards})"
            git push
          fi
